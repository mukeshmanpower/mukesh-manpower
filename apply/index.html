<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application - Mukesh Manpower</title>
    <link rel="stylesheet" href="../style.css">
    <meta name="theme-color" content="#0b192c">
</head>
<body>

    <!-- App Header -->
    <header class="app-header">
        <div class="logo-container">
            <h2>MUKESH <span>MANPOWER</span></h2>
        </div>
        <div class="header-badge">Apply</div>
    </header>

    <!-- Application Form Section -->
    <section class="hero-section" style="padding: 20px; text-align: left;">
        <h2 style="color: #fff; margin-bottom: 15px;">जॉब के लिए आवेदन करें</h2>
        <p class="tagline" style="margin-bottom: 20px;">अपनी सही जानकारी भरें ताकि हम आपसे संपर्क कर सकें।</p>
        
        <form action="https://wa.me/916379403821" method="get" target="_blank" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="color: #fff; font-size: 14px; display: block; margin-bottom: 5px;">पूरा नाम (Full Name):</label>
                <input type="text" name="text" placeholder="अपना नाम लिखें" required style="width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 16px;">
            </div>

            <div>
                <label style="color: #fff; font-size: 14px; display: block; margin-bottom: 5px;">मोबाइल नंबर (Mobile Number):</label>
                <input type="tel" name="phone" placeholder="अपना फोन नंबर लिखें" required style="width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 16px;">
            </div>

            <div>
                <label style="color: #fff; font-size: 14px; display: block; margin-bottom: 5px;">कार्यक्षेत्र / रुचि (Work / City):</label>
                <select name="city" style="width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 16px;">
                    <option value="Delhi">दिल्ली (Delhi NCR)</option>
                    <option value="TamilNadu">तमिलनाडु (Tamil Nadu)</option>
                    <option value="Hyderabad">हैदराबाद (Hyderabad)</option>
                    <option value="Bengaluru">बेंगलुरु (Bengaluru)</option>
                </select>
            </div>

            <button type="submit" class="cta-button" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">व्हॉट्सएप पर भेजें</button>
        </form>
    </section>

    <!-- Fixed Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item">🏠 होम</a>
        <a href="tel:6379403821" class="nav-item">📞 कॉल</a>
        <a href="https://wa.me/916379403821" target="_blank" class="nav-item">💬 व्हाट्सएप</a>
    </nav>

</body>
</html>
